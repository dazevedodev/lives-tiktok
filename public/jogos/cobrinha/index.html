<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobrinha dos Times</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #palco { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
  #palco canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
  #comecar { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000d; color: #fff; font: 700 28px system-ui; cursor: pointer; z-index: 50; text-align: center; gap: 10px; }
  #comecar small { font-weight: 400; font-size: 16px; opacity: .7; }
</style>
<script type="importmap">{ "imports": { "three": "/lib/three.module.js" } }</script>
</head>
<body>
<div id="palco">
  <canvas id="mundo"></canvas>
  <canvas id="hud"></canvas>
</div>
<div id="comecar">🔊 Clique para começar<small>(libera o som e a voz do jogo)</small></div>
<script src="/shared/som.js"></script>
<script src="/shared/live.js"></script>
<script src="/shared/times.js"></script>
<script src="/shared/voz.js"></script>
<script src="/shared/ranking.js"></script>
<script type="module" src="cobrinha.js"></script>
</body>
</html>
